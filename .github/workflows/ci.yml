name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements-release.txt
      - name: Verify pip rejects bad hashes
        run: >-
          python -c "import pathlib, subprocess, sys; pathlib.Path('bad-hash-requirements.txt').write_text('colorama==0.4.6 --hash=sha256:' + '0' * 64 + '\n', encoding='ascii'); result = subprocess.run([sys.executable, '-m', 'pip', 'install', '--require-hashes', '--only-binary=:all:', '--dry-run', '--ignore-installed', '-r', 'bad-hash-requirements.txt']); sys.exit(0 if result.returncode != 0 else 1)"
      - name: Compile
        run: python -m py_compile desktop_overlay.py
      - name: Test
        run: pytest
