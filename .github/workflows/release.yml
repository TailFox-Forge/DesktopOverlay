name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Compile
        run: python -m py_compile desktop_overlay.py
      - name: Test
        run: pytest
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build executable
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed ^
            --name Desktop_Overlay_Start ^
            --exclude-module tkinter ^
            --exclude-module PyQt5.QtWebEngineWidgets ^
            --exclude-module PyQt5.QtNetwork ^
            --exclude-module PyQt5.QtQml ^
            --exclude-module PyQt5.QtSql ^
            --exclude-module matplotlib ^
            --exclude-module scipy ^
            --exclude-module pandas ^
            desktop_overlay.py
      - name: Compute SHA256
        id: hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\Desktop_Overlay_Start.exe -Algorithm SHA256).Hash.ToLower()
          "sha256=$hash" >> $env:GITHUB_OUTPUT
      - name: Write release notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          @"
          ## DesktopOverlay $tag

          변경 사항:
          - config.json 에 직접 입력된 전역 단축키도 설정창과 같은 안전 규칙으로 검증합니다.
          - Space, Enter, F1 같은 수식어 없는 단독키는 시작 시 제거하고 Num0~Num9 단독키만 유지합니다.
          - 문자열 bool 값 true/false, yes/no, on/off, 1/0 을 명시적으로 해석합니다.
          - 프리릴리스 태그를 자동 업데이트 대상으로 안내하지 않도록 업데이트 판정을 보강했습니다.
          - 설정 파일 직접 편집 경로에 대한 회귀 테스트를 추가했습니다.

          SHA256:
          ~~~text
          ${{ steps.hash.outputs.sha256 }}  Desktop_Overlay_Start.exe
          ~~~
          "@ | Set-Content -Encoding utf8 release_notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --title "$tag" --notes-file release_notes.md
            gh release upload $tag dist\Desktop_Overlay_Start.exe --clobber
          } else {
            gh release create $tag dist\Desktop_Overlay_Start.exe --title "$tag" --notes-file release_notes.md
          }
