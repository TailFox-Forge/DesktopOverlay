name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Compile
        run: python -m py_compile desktop_overlay.py
      - name: Test
        run: pytest
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build executable
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed ^
            --name Desktop_Overlay_Start ^
            --exclude-module tkinter ^
            --exclude-module PyQt5.QtWebEngineWidgets ^
            --exclude-module PyQt5.QtNetwork ^
            --exclude-module PyQt5.QtQml ^
            --exclude-module PyQt5.QtSql ^
            --exclude-module matplotlib ^
            --exclude-module scipy ^
            --exclude-module pandas ^
            desktop_overlay.py
      - name: Compute SHA256
        id: hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\Desktop_Overlay_Start.exe -Algorithm SHA256).Hash.ToLower()
          "sha256=$hash" >> $env:GITHUB_OUTPUT
      - name: Write release notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          @"
          ## DesktopOverlay $tag

          변경 사항:
          - 단독 Esc, Tab, Backspace, Delete 는 계속 거부하되 수식어가 붙은 정상 조합은 허용합니다.
          - Ctrl+Delete, Ctrl+Backspace, Ctrl+Tab, Ctrl+Shift+Delete 같은 조합을 등록할 수 있게 했습니다.
          - Ctrl+Alt+Delete, Alt+Tab, Ctrl+Esc, Ctrl+Shift+Esc 같은 Windows 예약 조합은 계속 거부합니다.
          - 단축키 캡처 UI 에서 Backspace/Delete 삭제 동작은 수식어 없는 입력에만 적용합니다.
          - 예약/허용 단축키 조합에 대한 회귀 테스트를 추가했습니다.

          SHA256:
          ~~~text
          ${{ steps.hash.outputs.sha256 }}  Desktop_Overlay_Start.exe
          ~~~
          "@ | Set-Content -Encoding utf8 release_notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --title "$tag" --notes-file release_notes.md
            gh release upload $tag dist\Desktop_Overlay_Start.exe --clobber
          } else {
            gh release create $tag dist\Desktop_Overlay_Start.exe --title "$tag" --notes-file release_notes.md
          }
