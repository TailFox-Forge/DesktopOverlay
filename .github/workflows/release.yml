name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: python -m pip install -r requirements-release.txt
      - name: Compile
        run: python -m py_compile desktop_overlay.py
      - name: Test
        run: pytest
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build executable
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed ^
            --name Desktop_Overlay_Start ^
            --exclude-module tkinter ^
            --exclude-module PyQt5.QtWebEngineWidgets ^
            --exclude-module PyQt5.QtNetwork ^
            --exclude-module PyQt5.QtQml ^
            --exclude-module PyQt5.QtSql ^
            --exclude-module matplotlib ^
            --exclude-module scipy ^
            --exclude-module pandas ^
            desktop_overlay.py
      - name: Compute SHA256
        id: hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\Desktop_Overlay_Start.exe -Algorithm SHA256).Hash.ToLower()
          "sha256=$hash" >> $env:GITHUB_OUTPUT
      - name: Validate release tag
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must match vX.Y.Z. Actual: $env:TAG"
          }
      - name: Write release notes
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          SHA256: ${{ steps.hash.outputs.sha256 }}
        run: |
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $escapedTag = [regex]::Escape($env:TAG)
          $pattern = "(?ms)^## \[$escapedTag\]\([^\r\n]+\)\s*(?<body>.*?)(?=^## \[v|\z)"
          $match = [regex]::Match($changelog, $pattern)
          if (-not $match.Success) {
            throw "CHANGELOG.md does not contain release notes for $env:TAG"
          }
          $body = $match.Groups["body"].Value.Trim()
          @"
          ## DesktopOverlay $env:TAG

          $body

          SHA256:
          ~~~text
          $env:SHA256  Desktop_Overlay_Start.exe
          ~~~
          "@ | Set-Content -Encoding utf8 release_notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $env:TAG --title "$env:TAG" --notes-file release_notes.md
            gh release upload $env:TAG dist\Desktop_Overlay_Start.exe --clobber
          } else {
            gh release create $env:TAG dist\Desktop_Overlay_Start.exe --title "$env:TAG" --notes-file release_notes.md
          }
