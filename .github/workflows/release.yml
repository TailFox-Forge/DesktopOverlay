name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Verify version metadata
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "태그 형식이 올바르지 않습니다: $tag (예: v1.2.3)"
          }
          $expected = $tag.Substring(1)

          $source = Get-Content desktop_overlay.py -Raw -Encoding utf8
          if ($source -notmatch 'APP_VERSION\s*=\s*"([^"]+)"') {
            throw "desktop_overlay.py 에서 APP_VERSION 을 찾지 못했습니다."
          }
          $appVersion = $Matches[1]
          if ($appVersion -ne $expected) {
            throw "APP_VERSION($appVersion) 이 태그($tag) 와 다릅니다. 태그를 찍기 전에 APP_VERSION 을 올리세요."
          }

          $readme = Get-Content README.md -Raw -Encoding utf8
          if ($readme -notmatch [regex]::Escape("releases/tag/$tag")) {
            throw "README 의 버전별 변경 내역에 $tag 항목이 없습니다. 태그를 찍기 전에 추가하세요."
          }

          Write-Host "APP_VERSION=$appVersion, README 변경 내역 확인 완료"
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-release.txt
      - name: Compile
        run: python -m py_compile desktop_overlay.py
      - name: Test
        run: pytest
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build distribution
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --onedir --windowed ^
            --name Desktop_Overlay_Start ^
            --exclude-module tkinter ^
            --exclude-module PyQt5.QtWebEngineWidgets ^
            --exclude-module PyQt5.QtNetwork ^
            --exclude-module PyQt5.QtQml ^
            --exclude-module PyQt5.QtSql ^
            --exclude-module matplotlib ^
            --exclude-module scipy ^
            --exclude-module pandas ^
            desktop_overlay.py
      - name: Pack distribution
        shell: pwsh
        run: |
          Compress-Archive -Path dist\Desktop_Overlay_Start\* -DestinationPath dist\DisplayOverlay.zip -Force
      - name: Compute SHA256
        id: hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\DisplayOverlay.zip -Algorithm SHA256).Hash.ToLower()
          "sha256=$hash" >> $env:GITHUB_OUTPUT
      - name: Validate release tag
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must match vX.Y.Z. Actual: $env:TAG"
          }
      - name: Write release notes
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          SHA256: ${{ steps.hash.outputs.sha256 }}
        run: |
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $escapedTag = [regex]::Escape($env:TAG)
          $pattern = "(?ms)^## \[$escapedTag\]\([^\r\n]+\)\s*(?<body>.*?)(?=^## \[v|\z)"
          $match = [regex]::Match($changelog, $pattern)
          if (-not $match.Success) {
            throw "CHANGELOG.md does not contain release notes for $env:TAG"
          }
          $body = $match.Groups["body"].Value.Trim()
          @"
          ## DesktopOverlay $env:TAG

          $body

          SHA256:
          ~~~text
          $env:SHA256  DisplayOverlay.zip
          ~~~
          "@ | Set-Content -Encoding utf8 release_notes.md

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: displayoverlay-release
          path: |
            dist/DisplayOverlay.zip
            release_notes.md
          if-no-files-found: error
          retention-days: 7

  publish-release:
    runs-on: ubuntu-latest
    needs: build-windows
    permissions:
      contents: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: displayoverlay-release
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          REPO="${GITHUB_REPOSITORY:?}"
          ZIP_PATH="$(find dist -type f -name 'DisplayOverlay.zip' | head -n 1)"
          NOTES_PATH="$(find dist -type f -name 'release_notes.md' | head -n 1)"
          if [ -z "$ZIP_PATH" ] || [ -z "$NOTES_PATH" ]; then
            echo "Downloaded artifact layout:"
            find dist -maxdepth 5 -type f -print
            exit 1
          fi

          ASSET_NAME="DisplayOverlay.zip"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" --title "$TAG" --notes-file "$NOTES_PATH"
            ASSET_COUNT="$(gh release view "$TAG" --repo "$REPO" --json assets --jq --arg name "$ASSET_NAME" '[.assets[] | select(.name == $name)] | length')"
            if [ "$ASSET_COUNT" != "0" ]; then
              echo "::error::Release $TAG already has $ASSET_NAME. Refusing to overwrite immutable release asset."
              echo "::error::If this is an intentional recovery, delete the existing asset first: gh release delete-asset $TAG $ASSET_NAME --repo $REPO --yes"
              exit 1
            fi
            gh release upload "$TAG" "$ZIP_PATH" --repo "$REPO"
          else
            gh release create "$TAG" "$ZIP_PATH" --repo "$REPO" --title "$TAG" --notes-file "$NOTES_PATH"
          fi
