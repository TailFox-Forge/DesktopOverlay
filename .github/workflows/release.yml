name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Compile
        run: python -m py_compile desktop_overlay.py
      - name: Test
        run: pytest
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build executable
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed ^
            --name Desktop_Overlay_Start ^
            --exclude-module tkinter ^
            --exclude-module PyQt5.QtWebEngineWidgets ^
            --exclude-module PyQt5.QtNetwork ^
            --exclude-module PyQt5.QtQml ^
            --exclude-module PyQt5.QtSql ^
            --exclude-module matplotlib ^
            --exclude-module scipy ^
            --exclude-module pandas ^
            desktop_overlay.py
      - name: Compute SHA256
        id: hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\Desktop_Overlay_Start.exe -Algorithm SHA256).Hash.ToLower()
          "sha256=$hash" >> $env:GITHUB_OUTPUT
      - name: Write release notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          @"
          ## DesktopOverlay $tag

          변경 사항:
          - 손상된 config.json 값을 안전하게 보정하고 설정 저장을 원자적 교체/지연 저장으로 바꿨습니다.
          - 이미지 처리 worker 취소와 종료 정리를 추가해 대형 GIF 처리 중 스레드/메모리 누적을 줄였습니다.
          - 업데이트 확인 예외 처리와 버전 비교를 보강해 프리릴리스/잘못된 태그 오진을 막았습니다.
          - Windows 자동 실행 메뉴에서 동기 PowerShell 조회를 제거하고 경로 갱신을 명시 동작으로 분리했습니다.
          - 단독 전역 단축키 정책을 강화하고 Windows CI 검증을 추가했습니다.

          SHA256:
          ~~~text
          ${{ steps.hash.outputs.sha256 }}  Desktop_Overlay_Start.exe
          ~~~
          "@ | Set-Content -Encoding utf8 release_notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --title "$tag" --notes-file release_notes.md
            gh release upload $tag dist\Desktop_Overlay_Start.exe --clobber
          } else {
            gh release create $tag dist\Desktop_Overlay_Start.exe --title "$tag" --notes-file release_notes.md
          }
